name: Build Windows App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giai nen file .zip neu co (neu ban upload ca file zip len repo)
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter *.zip -File | ForEach-Object {
            Write-Host "Extracting $($_.Name)"
            Expand-Archive -Path $_.FullName -DestinationPath . -Force
          }

      - name: Prepare project (tu tim hoac tu tao package.json)
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path . -Recurse -Filter package.json -File |
                 Where-Object { $_.FullName -notmatch 'node_modules' } | Select-Object -First 1
          if ($pkg) {
            $dir = $pkg.DirectoryName
            Write-Host "Found package.json in: $dir"
          } else {
            Write-Host "package.json not found - generating package.json and main.js"
            if (-not (Test-Path index.html)) {
              Write-Host "Files in repo:"
              Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } | ForEach-Object { $_.FullName }
              throw "Thieu index.html o thu muc goc. Hay upload index.html (va build/icon.png) len repo."
            }
            $icon = Test-Path build/icon.png
            $win = @{ target = @('nsis','portable') }
            $files = @('main.js','index.html')
            if ($icon) { $win.icon = 'build/icon.png'; $files += 'build/icon.png' }
            $obj = [ordered]@{
              name = 'dylan-mouse-tool'; version = '1.0.0'; description = 'Dylan Mouse Tool'
              main = 'main.js'; author = 'Dylan'; license = 'MIT'
              scripts = @{ build = 'electron-builder --win --publish never' }
              devDependencies = @{ electron = '^31.0.0'; 'electron-builder' = '^24.13.3' }
              build = @{
                appId = 'com.dylan.mousetool'; productName = 'Dylan Mouse Tool'
                directories = @{ output = 'dist' }; files = $files; win = $win
                nsis = @{ oneClick = $false; allowToChangeInstallationDirectory = $true }
              }
            }
            $obj | ConvertTo-Json -Depth 10 | Set-Content -Path package.json -Encoding utf8
            if (-not (Test-Path main.js)) {
              $js = @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          function createWindow() {
            const win = new BrowserWindow({
              width: 1040, height: 760, minWidth: 380, minHeight: 600,
              backgroundColor: '#050507', autoHideMenuBar: true, title: 'Dylan Mouse Tool',
              webPreferences: { contextIsolation: true, nodeIntegration: false }
            });
            win.loadFile(path.join(__dirname, 'index.html'));
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => app.quit());
          '@
              Set-Content -Path main.js -Value $js -Encoding utf8
            }
            $dir = (Get-Location).Path
          }
          $dir = $dir -replace '\\','/'
          Add-Content -Path $env:GITHUB_ENV -Value "APP_DIR=$dir"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build (installer + portable)
        working-directory: ${{ env.APP_DIR }}
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dylan-Mouse-Tool-windows
          path: ${{ env.APP_DIR }}/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (only on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/dist/*.exe
          generate_release_notes: true
          
